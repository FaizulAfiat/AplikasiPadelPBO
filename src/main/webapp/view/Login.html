<!DOCTYPE html>
<html lang="id">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>Login - Padel App</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <style>

            .border-grid {
                border-color: #e5e5e5;
            }

        </style>

    </head>

    <body class="bg-white text-black min-h-screen flex flex-col">

        <header class="border-b border-grid p-6">

            <h1 class="text-xl font-black uppercase tracking-tighter">
                Padel<span class="text-blue-600">App</span>
            </h1>

        </header>

        <main class="flex-1 flex flex-col md:flex-row">

            <!-- LEFT -->

            <div class="md:w-1/2 p-12 border-r border-grid flex flex-col justify-between">

                <div>

                    <span class="text-xs font-bold uppercase opacity-50 block mb-4">
                        01 / Access Gate
                    </span>

                    <h2 class="text-7xl font-black uppercase leading-none tracking-tighter">
                        Ready to<br>Play?
                    </h2>

                </div>

                <div class="flex items-center gap-2">

                    <span class="w-3 h-3 bg-cyan-400 rounded-full"></span>

                    <p class="text-xs font-bold uppercase tracking-widest">
                        Kelompok 4
                    </p>

                </div>

            </div>

            <!-- RIGHT -->

            <div class="md:w-1/2 p-12 flex items-center justify-center bg-gray-50/50">

                <div class="w-full max-w-md">

                    <!-- ERROR MESSAGE -->

                    <script>

                        const params = new URLSearchParams(window.location.search);

                        if (params.get("error") === "1") {

                            alert("Email atau Password salah!");

                        }

                    </script>

                    <!-- FORM -->

                    <form action="/Aplikasi_Padel_Tubes_PBO/view/login"
                          method="POST"
                          class="space-y-8">

                        <div class="border-b-2 border-black pb-2">

                            <label class="text-xs font-bold uppercase opacity-50">
                                Email
                            </label>

                            <input type="text"
                                   name="email"
                                   class="w-full bg-transparent text-xl font-bold outline-none placeholder:opacity-20"
                                   placeholder="TYPE_HERE"
                                   required>

                        </div>

                        <div class="border-b-2 border-black pb-2">

                            <label class="text-xs font-bold uppercase opacity-50">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="w-full bg-transparent text-xl font-bold outline-none placeholder:opacity-20"
                                   placeholder="••••••••"
                                   required>

                        </div>

                        <button type="submit"
                                class="w-full bg-black text-white py-4 font-black uppercase tracking-widest hover:bg-red-600 transition-colors">

                            Sign In →

                        </button>

                    </form>

                    <p class="mt-8 text-xs font-bold uppercase tracking-widest text-center">

                        New Member?

                        <a href="Register.html"
                           class="underline decoration-red-600 decoration-2">

                            Create Account

                        </a>

                    </p>

                </div>

            </div>

        </main>

    </body>

</html>
