<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - Padel App</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            .border-grid {
                border-color: #e5e5e5;
            }
        </style>
    </head>
    <body class="bg-white text-black min-h-screen flex flex-col">

        <header class="border-b border-grid p-6 flex justify-between items-center">
            <h1 class="text-xl font-black uppercase tracking-tighter">Padel<span class="text-blue-600">App</span></h1>
            <a href="Login.html" class="text-xs font-bold uppercase tracking-widest border-2 border-black px-4 py-1 hover:bg-black hover:text-white transition-all">Back to Login</a>
        </header>

        <main class="flex-1 flex flex-col md:flex-row-reverse">
            <div class="relative md:w-1/2 p-12 border-l border-grid flex flex-col justify-between text-right overflow-hidden group">
                <div class="absolute inset-0 z-0">
                    <img src="../img/padel1.jpg" alt="Background" class="w-full h-full object-cover grayscale opacity-30 group-hover:opacity-50 group-hover:scale-110 transition-all duration-700">
                    <div class="absolute inset-0 bg-gradient-to-l from-white/80 via-white/20 to-transparent"></div>
                </div>

                <div class="relative z-10">
                    <span class="text-xs font-bold uppercase opacity-50 block mb-4">02 / Identity Creation</span>
                    <h2 class="text-7xl font-black uppercase leading-none tracking-tighter">Join the<br>Circuit</h2>
                </div>

                <div class="relative z-10 flex items-center justify-end gap-2">
                    <p class="text-xs font-bold uppercase tracking-widest">Kelompok 4</p>
                    <span class="w-3 h-3 bg-blue-600 rounded-full animate-ping"></span>
                </div>
            </div>

            <div class="md:w-1/2 p-12 flex items-center justify-center">
                <div class="w-full max-w-md">
                    <form action="register" method="POST" class="space-y-8">
                        <div class="border-b-2 border-black pb-2">
                            <label class="text-xs font-bold uppercase opacity-50">Username</label>
                            <input type="text" name="username" class="w-full bg-transparent text-xl font-bold outline-none" placeholder="TYPE A NAME" required>
                        </div>
                        <div class="border-b-2 border-black pb-2">
                            <label class="text-xs font-bold uppercase opacity-50">Nama Lengkap</label>
                            <input type="text" name="fullname" class="w-full bg-transparent text-xl font-bold outline-none" placeholder="FULL NAME" required>
                        </div>
                        <div class="border-b-2 border-black pb-2">
                            <label class="text-xs font-bold uppercase opacity-50">Jenis Kelamin</label>
                            <select name="gender" class="w-full bg-transparent text-xl font-bold outline-none cursor-pointer" required>
                                <option value="" disabled selected class="text-gray-400">PILIH JENIS KELAMIN</option>
                                <option value="L" class="text-black bg-white">LAKI-LAKI</option>
                                <option value="P" class="text-black bg-white">PEREMPUAN</option>
                            </select>
                        </div>
                        <div class="border-b-2 border-black pb-2">
                            <label class="text-xs font-bold uppercase opacity-50">Email</label>
                            <input type="text" name="email" class="w-full bg-transparent text-xl font-bold outline-none" placeholder="EMAIL ADDRESS" required>
                        </div>
                        <div class="border-b-2 border-black pb-2">
                            <label class="text-xs font-bold uppercase opacity-50">Password</label>
                            <input type="password" name="password" class="w-full bg-transparent text-xl font-bold outline-none" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="w-full bg-black text-white py-4 font-black uppercase tracking-widest hover:bg-cyan-400 hover:text-black transition-colors">
                            Register Account →
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
